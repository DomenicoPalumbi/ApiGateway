server:
  port: 8082

spring:
  application:
    name: API-GATEWAY-SERVICE
  datasource:
    url: jdbc:postgresql://localhost:5432/UsersDB
    username: postgres
    password: domelite
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  cloud:
    gateway:
      routes:
        - id: docenti-endpoints
          uri: http://localhost:8080
          predicates:
            - Path=/admin/docenti/**
          filters:
            - StripPrefix=1

        - id: discenti-endpoints
          uri: http://localhost:8080
          predicates:
            - Path=/admin/discenti/**
          filters:
            - StripPrefix=1

        - id: corsi-endpoints
          uri: http://localhost:8081
          predicates:
            - Path=/admin/corsi/**
          filters:
            - StripPrefix=1
        - id: test-corsi
          uri: http://localhost:8081
          predicates:
            - Path=/admin/ping
          filters:
            - StripPrefix=1
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: DEBUG
    org.springframework.security: DEBUG